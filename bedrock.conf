# Bedrock cluster host defaults.
# Scripts source this file if present. Environment variables still override values.

# LXC networking for new containers.
BEDROCK_NET_INTERFACE="ens7"
BEDROCK_NET_PREFIX="16"
BEDROCK_NET_GATEWAY="192.168.0.1"

# IP allocation strategy for create-server.sh.
# Supported values: inventory-safe, ping-probe
BEDROCK_IP_ALLOCATION_METHOD="inventory-safe"
